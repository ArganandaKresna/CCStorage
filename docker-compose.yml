services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # s3
      - "9001:9001"   # minio
    environment:
      MINIO_ROOT_USER: "novacron"
      MINIO_ROOT_PASSWORD: "ccproject"
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
